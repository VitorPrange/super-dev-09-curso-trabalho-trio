<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turmas - Trabalho Trio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>🎓 Trabalho Trio</h1>
    <p>Gerenciamento de Escola de Idiomas</p>
  </header>

  <nav class="breadcrumbs" id="breadcrumbs"></nav>

  <main class="container">
    <div class="page-header">
      <h2>Turmas</h2>
      <button class="btn" onclick="document.getElementById('crud-form').scrollIntoView({ behavior: 'smooth' })">➕ Nova Turma</button>
    </div>

    <div id="alert"></div>

    <div id="crud-root" data-entity="turmas">
      <div class="panel">
        <h3 id="form-title">Nova Turma</h3>
        <form id="crud-form"></form>
      </div>

      <div class="panel">
        <h3>Lista de Turmas</h3>
        <div class="table-container">
          <table>
            <thead></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>Confirmar Exclusão</h3>
      <div class="modal-body">
        <p>Tem certeza que deseja remover esta turma? Esta ação não pode ser desfeita.</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary btn-sm" id="modal-cancel">Cancelar</button>
        <button class="btn btn-danger btn-sm" id="modal-confirm">Remover</button>
      </div>
    </div>
  </div>

  <footer>
    <p>Trabalho Trio - Protótipo Frontend &middot; Escola de Idiomas</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderBreadcrumbs([
      { label: 'Início', href: 'index.html' },
      { label: 'Turmas', href: 'turmas.html' }
    ]);
  </script>
</body>
</html>
